name: CI

on:
  push:
  pull_request:

jobs:
  rules-and-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - run: npm install --no-audit --no-fund
        working-directory: functions
      - run: npm test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: routeLogisticsWeb
    env:
      VITE_FIREBASE_API_KEY: ci
      VITE_FIREBASE_PROJECT_ID: demo-routelogistics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      # Pre-existing lint debt in pages/services; make blocking once cleaned up.
      - run: npm run lint
        continue-on-error: true
      - run: npm run build
