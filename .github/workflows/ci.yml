name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_browser_coverage:
        description: Run all browser acceptance cases in Chromium, Firefox and WebKit
        type: boolean
        default: false

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: functions
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
        working-directory: routeLogisticsWeb
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser:smoke
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-smoke-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  browser-full:
    if: github.event_name == 'workflow_dispatch' && inputs.full_browser_coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: functions
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
        working-directory: routeLogisticsWeb
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run test:browser -- --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-full-${{ matrix.browser }}-failure
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  rules-and-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
        working-directory: functions
      - run: npm run test:functions
      - run: npm run test:rules
      - run: npm run test:e2e

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: routeLogisticsWeb
    env:
      VITE_FIREBASE_API_KEY: ci
      VITE_FIREBASE_PROJECT_ID: demo-routelogistics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      # The web UI harness uses the matching React/test-renderer pair from mobile.
      - run: npm ci --no-audit --no-fund
        working-directory: routeLogisticsMobile
      - run: npm run test:web
        working-directory: .
      - run: npm run lint
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: routeLogisticsMobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx expo install --check
      - run: npm test
      - run: npx expo export --platform ios --platform android --max-workers 2
